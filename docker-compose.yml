services:
  mysql:
    image: mysql:8.0
    container_name: atomik-clips-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: atomik_clips_dev
      MYSQL_USER: atomik_user
      MYSQL_PASSWORD: atomik_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - atomik-clips-network

volumes:
  mysql_data:
    driver: local

networks:
  atomik-clips-network:
    driver: bridge

